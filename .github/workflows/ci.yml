name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Verify Chromium setup on Linux CI
        if: runner.os == 'Linux' && matrix.node == 22
        # Hosted Linux runners can restrict unprivileged browser namespaces.
        # This switch affects Chromium only, NOT the Codex execution sandbox.
        env:
          BEAT_CHROMIUM_NO_SANDBOX: '1'
        run: node beat.js setup --browser-only --with-deps
      - name: Verify Chromium setup on macOS
        if: runner.os == 'macOS'
        run: node beat.js setup --browser-only
      - name: Enable Linux user namespaces for Codex bubblewrap
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Match the host preparation used by OpenAI's official codex-action
          # on GitHub-hosted Ubuntu runners. This enables Codex's sandbox; it
          # does not disable the Codex workspace-write policy itself.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - name: Verify native Linux sandbox permits workspace writes and denies outside writes
        if: runner.os == 'Linux'
        run: node scripts/sandbox-smoke.js
      - name: Verify isolated real Codex tool loop
        run: npm run test:codex
      - name: Verify POSIX installer, updates, quoting and state preservation
        if: runner.os != 'Windows'
        run: npm run test:install

  node-bootstrap:
    name: Private Node bootstrap / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check POSIX shell syntax
        run: sh -n install.sh
      - name: Verify official Node download, SHA-256 and isolated installation
        env:
          BEAT_SMOKE_BOOTSTRAP_NODE: '1'
        run: node scripts/install-smoke.js
